<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STAIR Client Work</title>
<meta name="description" content="STAIR Digital engagement decks for Dinshaw’s and Vakils.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200..700&family=Inter:wght@400;500;600&family=Martian+Mono:wdth,wght@75..112.5,300..500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Tokens. Dark by design: this is a presentation surface.
   Teal = done / live, amber = in flight, slate = parked.
   Client colours appear only where the client is named.
   ============================================================ */
:root{
  --void:#03090A; --hull:#071315; --hull-2:#0B1B1D;
  --line:rgba(140,220,208,.10); --line-2:rgba(140,220,208,.20); --line-3:rgba(140,220,208,.34);
  --ink:#E6EFED; --ink-2:#9BB0AC; --ink-3:#5C726F;
  --signal:#43E3D0; --flare:#FF9257; --hold:#8E9AAB;
  /* ordinal teal ramp for charts, validated on --void */
  --t1:#1E7A72; --t2:#2DB3A5; --t3:#5FF0DE;
  --plate:#EEF3F1; --plate-ink:#0A1A1B;
  --d:#FF4A3D; --v:#6C9BFF;
  --f-disp:"Inter Tight","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Martian Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --ease:cubic-bezier(.16,.84,.24,1);
  --gx:clamp(16px,3.2vw,44px);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--void);color:var(--ink);font:400 15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3,h4,p,ol,ul,figure,figcaption{margin:0}
ol,ul{padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block}
b{font-weight:600}
[hidden]{display:none!important}
:focus-visible{outline:1px solid var(--signal);outline-offset:3px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(140,220,208,.07) 1px,transparent 1.3px);background-size:26px 26px;
  -webkit-mask-image:radial-gradient(120% 90% at 50% 40%,#000 0,transparent 78%);mask-image:radial-gradient(120% 90% at 50% 40%,#000 0,transparent 78%)}

.mono{font-family:var(--f-mono);font-size:10.5px;line-height:1.25;letter-spacing:.1em;text-transform:uppercase;font-stretch:92%}
.view{position:fixed;inset:0;z-index:1;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.view.enter{animation:view-in .7s var(--ease) both}
@keyframes view-in{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}

/* ---------- bars ---------- */
.bar{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px;padding:0 var(--gx)}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand img{height:17px;width:auto;filter:invert(1)}
.brand b{font:600 12.5px/1 var(--f-disp);letter-spacing:.24em}
.brand .mono{color:var(--ink-2)}
.brand i{width:1px;height:14px;background:var(--line-3)}
kbd{display:inline-block;font:400 10px/1 var(--f-mono);padding:4px 6px;border:1px solid var(--line-2);color:var(--ink-2);margin-right:4px}

/* HUD corner brackets */
.k{position:absolute;width:10px;height:10px;border:0 solid var(--signal);pointer-events:none;transition:transform .45s var(--ease)}
.k.tl{top:-1px;left:-1px;border-top-width:1px;border-left-width:1px}
.k.tr{top:-1px;right:-1px;border-top-width:1px;border-right-width:1px}
.k.bl{bottom:-1px;left:-1px;border-bottom-width:1px;border-left-width:1px}
.k.br{bottom:-1px;right:-1px;border-bottom-width:1px;border-right-width:1px}

/* ============================================================
   HOME: the index wall
   ============================================================ */
.home-bar .stamp{color:var(--ink-2);text-align:right}
.home-mid{position:relative;display:grid;place-items:center;padding:12px var(--gx);overflow:hidden}
.wall{position:absolute;inset:0;z-index:0;display:flex;gap:clamp(16px,2.2vw,34px);padding:0 var(--gx);overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 16%,#000 84%,transparent);mask-image:linear-gradient(180deg,transparent 0,#000 16%,#000 84%,transparent)}
.wall-col{flex:1;min-width:0}
.wall-col ul{animation:wall-rise var(--dur,140s) linear infinite;animation-delay:var(--off,0s)}
@keyframes wall-rise{to{transform:translate3d(0,-50%,0)}}
.wall li{font:400 10.5px/2.45 var(--f-mono);font-stretch:88%;color:var(--ink-3);opacity:.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:color .5s var(--ease) var(--t,0s),opacity .5s var(--ease) var(--t,0s)}
.wall li i{font-style:normal;opacity:.6}
.home[data-focus="d"] .wall li[data-c="d"]{color:var(--d);opacity:1}
.home[data-focus="v"] .wall li[data-c="v"]{color:var(--v);opacity:1}
.home[data-focus="d"] .wall li[data-c="v"],.home[data-focus="v"] .wall li[data-c="d"]{opacity:.08}
.scrim{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(56% 58% at 50% 52%,rgba(3,9,10,.96) 0,rgba(3,9,10,.82) 52%,rgba(3,9,10,0) 100%)}
.hero{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;width:min(820px,100%)}
.hero .mono{color:var(--ink-2)}
.hero h1{margin-top:18px;font:200 clamp(50px,min(8.4vw,13vh),128px)/.9 var(--f-disp);letter-spacing:-.055em}
.hero h1 b{font-weight:500}
.caret{display:inline-block;width:.07em;height:.74em;margin-left:.05em;background:var(--signal);vertical-align:-.02em;box-shadow:0 0 18px var(--signal);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hero p{margin-top:22px;max-width:54ch;color:var(--ink-2);font-size:clamp(14px,1.15vw,16.5px);text-wrap:pretty}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;width:min(720px,100%);margin-top:clamp(26px,5vh,50px)}
.tile{position:relative;display:grid;color:inherit;text-decoration:none;grid-template-rows:minmax(0,1fr) auto;height:clamp(160px,24vh,214px);padding:20px 22px;text-align:left;
  border:1px solid var(--line-2);background:rgba(7,19,21,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);isolation:isolate;
  transition:border-color .4s var(--ease)}
.tile::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--plate);transform:scaleY(0);transform-origin:50% 100%;transition:transform .6s var(--ease)}
.tile .scan{position:absolute;left:0;right:0;top:100%;height:1px;background:var(--signal);box-shadow:0 0 16px 1px var(--signal);opacity:0;pointer-events:none}
.tile img{place-self:center;width:auto;height:auto;max-width:76%;max-height:var(--lh,52px);filter:brightness(0) invert(1);transition:filter .3s .12s}
.tile-meta{display:block;color:var(--ink-2);white-space:nowrap;transition:color .3s .12s}
.tile .go{position:absolute;top:16px;right:18px;color:var(--plate-ink);opacity:0;transform:translateX(-6px);transition:opacity .3s .15s,transform .4s .15s var(--ease)}
.tile:hover,.tile:focus-visible{border-color:transparent;outline:none}
.tile:hover::before,.tile:focus-visible::before{transform:scaleY(1)}
.tile:hover .scan,.tile:focus-visible .scan{animation:sweep .62s var(--ease) both}
@keyframes sweep{0%{top:100%;opacity:1}80%{opacity:1}100%{top:0;opacity:0}}
.tile:hover img,.tile:focus-visible img{filter:none}
.tile:hover .tile-meta,.tile:focus-visible .tile-meta{color:var(--plate-ink)}
.tile:hover .go,.tile:focus-visible .go{opacity:1;transform:none}
.tile:hover .k.tl,.tile:focus-visible .k.tl{transform:translate(-6px,-6px)}
.tile:hover .k.tr,.tile:focus-visible .k.tr{transform:translate(6px,-6px)}
.tile:hover .k.bl,.tile:focus-visible .k.bl{transform:translate(-6px,6px)}
.tile:hover .k.br,.tile:focus-visible .k.br{transform:translate(6px,6px)}
.home-foot{border-top:1px solid var(--line);min-height:54px;color:var(--ink-2)}
.legend{display:flex;gap:22px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:6px;height:6px;margin-right:9px;vertical-align:1px;background:var(--c)}

/* ============================================================
   DECK chrome
   ============================================================ */
.deck-bar{border-bottom:1px solid var(--line)}
.deck-bar .left{display:flex;align-items:center;gap:18px;min-width:0}
.back{display:flex;align-items:center;gap:10px;color:var(--ink-2);padding:8px 0;transition:color .2s}
.back:hover{color:var(--ink)}
.back svg{width:14px;height:14px}
.switch{display:flex;gap:2px;padding:3px;border:1px solid var(--line)}
.switch button{height:30px;padding:0 14px;display:grid;place-items:center;opacity:.42;transition:opacity .25s,background .25s}
.switch button:hover{opacity:.8}
.switch button[aria-current="true"]{opacity:1;background:rgba(140,220,208,.07)}
.switch img{height:15px;width:auto;filter:brightness(0) invert(1)}
.switch button[data-id="vakils"] img{height:19px}
.where{display:flex;align-items:center;gap:20px;color:var(--ink-2);white-space:nowrap}
.where .crumb{max-width:34ch;overflow:hidden;text-overflow:ellipsis}
.where .count b{color:var(--ink);font-weight:500}
.maskbtn{display:flex;align-items:center;gap:8px;color:var(--ink-2);padding:7px 10px;border:1px solid var(--line-2);transition:color .2s,border-color .2s}
.maskbtn:hover{color:var(--ink);border-color:var(--line-3)}
.maskbtn[aria-pressed="true"]{color:var(--flare);border-color:color-mix(in srgb,var(--flare) 45%,transparent)}
.maskbtn svg{width:14px;height:14px}
.deck-foot{border-top:1px solid var(--line);min-height:56px}
.prog{flex:1;display:flex;gap:4px;align-items:center;height:56px;min-width:0}
.seg{position:relative;flex:1;height:30px;display:flex;align-items:center}
.seg::before{content:"";width:100%;height:2px;background:var(--line-2);transition:background .3s,box-shadow .3s}
.seg.done::before{background:var(--ink-3)}
.seg.on::before{background:var(--signal);box-shadow:0 0 12px var(--signal)}
.seg:hover::before{background:var(--ink-2)}
.seg .lbl{position:absolute;bottom:32px;left:0;white-space:nowrap;padding:7px 9px;background:var(--hull-2);border:1px solid var(--line-2);color:var(--ink);opacity:0;transform:translateY(4px);pointer-events:none;transition:opacity .2s,transform .2s}
.seg:nth-last-child(-n+3) .lbl{left:auto;right:0}
.seg:hover .lbl,.seg:focus-visible .lbl{opacity:1;transform:none}
.arrows{display:flex;gap:6px}
.arrows button{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line-2);color:var(--ink-2);transition:color .2s,border-color .2s,background .2s}
.arrows button:hover:not(:disabled){color:var(--ink);border-color:var(--line-3);background:rgba(140,220,208,.05)}
.arrows button:disabled{opacity:.3;cursor:default}
.arrows svg{width:15px;height:15px}

/* ============================================================
   Slides
   ============================================================ */
.stage{position:relative;overflow:hidden;--from:32px;--to:-32px}
.stage::after{content:"";position:absolute;inset:-20% -10% auto auto;width:60vw;height:60vw;pointer-events:none;z-index:0;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--client,var(--signal)) 7%,transparent),transparent);opacity:.9}
.slide{position:absolute;inset:0;z-index:1;overflow-y:auto;overscroll-behavior:contain;padding:clamp(20px,4.6vh,54px) clamp(16px,5.6vw,92px);
  opacity:0;visibility:hidden;transform:translate3d(var(--from),0,0);scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.slide.is-on{opacity:1;visibility:visible;transform:none;transition:opacity .55s var(--ease) .06s,transform .8s var(--ease)}
.slide.is-leaving{visibility:visible;opacity:0;transform:translate3d(var(--to),0,0);transition:opacity .38s var(--ease),transform .8s var(--ease)}
.sl{max-width:1240px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:clamp(16px,2.9vh,28px)}

@media (prefers-reduced-motion:no-preference){
  .r{opacity:0}
  .is-on .r{animation:in .8s var(--ease) both;animation-delay:calc(var(--i,0) * 75ms + 140ms)}
  .is-leaving .r{opacity:1}
}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.s-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.eyebrow{display:flex;align-items:center;gap:14px;color:var(--ink-2)}
.eyebrow .cat{color:var(--signal);display:flex;align-items:center;gap:14px}
.eyebrow .cat::after{content:"";width:26px;height:1px;background:var(--line-3)}
.s-title{font:300 clamp(28px,min(4.1vw,6.6vh),58px)/1.04 var(--f-disp);letter-spacing:-.04em;max-width:24ch;text-wrap:balance}
.s-title b{font-weight:500}
.lede{font-size:clamp(14px,1.18vw,17px);line-height:1.58;color:var(--ink-2);max-width:64ch;text-wrap:pretty}
.chip{--tone:var(--signal);display:inline-flex;align-items:center;gap:9px;height:28px;padding:0 12px;font:400 10px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;
  color:var(--tone);border:1px solid color-mix(in srgb,var(--tone) 42%,transparent);background:color-mix(in srgb,var(--tone) 8%,transparent)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--tone);box-shadow:0 0 10px var(--tone)}
.chip[data-tone="flare"]{--tone:var(--flare)}
.chip[data-tone="hold"]{--tone:var(--hold)}
.chip[data-tone="hold"]::before{background:transparent;border:1px solid var(--tone);box-shadow:none}
@media (prefers-reduced-motion:no-preference){.chip[data-tone="flare"]::before{animation:pulse 1.8s ease-in-out infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--flare) 22%,transparent)}}

.s-top{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(0,1fr);gap:clamp(24px,4vw,64px);align-items:center}
.s-top.solo{grid-template-columns:minmax(0,1fr)}
.s-copy{display:flex;flex-direction:column;gap:16px}
.s-aside{display:flex;flex-direction:column;gap:16px;min-width:0}
.metrics.mini{grid-template-columns:repeat(auto-fit,minmax(92px,1fr));border-top:0}
.metrics.mini .m{padding-top:0}
.metrics.mini .m b{font-size:clamp(19px,1.8vw,27px)}
.metrics.mini .m .mono{margin-top:7px;font-size:8.5px}
.s-copy.split{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:clamp(24px,4vw,64px);align-items:end}
.s-copy.split .lede{padding-bottom:.3em}

/* problem / did / stands */
.pws{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.42fr) minmax(0,1fr);border-top:1px solid var(--line)}
.pw{padding:16px clamp(14px,1.8vw,26px) 0 0}
.pw + .pw{padding-left:clamp(14px,1.8vw,26px);border-left:1px solid var(--line)}
.pw h3{display:flex;align-items:center;gap:9px;margin-bottom:11px;color:var(--ink-2)}
.pw h3::before{content:"";width:6px;height:6px;border:1px solid currentColor}
.pw.did h3{color:var(--signal)}
.pw.did h3::before{background:var(--signal)}
.pw.now h3{color:var(--tone,var(--signal))}
.pw.now[data-tone="flare"]{--tone:var(--flare)} .pw.now[data-tone="hold"]{--tone:var(--hold)}
.pw p,.pw li{font-size:clamp(13px,1vw,14.5px);line-height:1.55;color:rgba(230,239,237,.9);text-wrap:pretty}
.pw ul{display:grid;gap:7px}
.pw li{position:relative;padding-left:17px}
.pw li::before{content:"";position:absolute;left:0;top:.74em;width:8px;height:1px;background:var(--signal)}

/* metrics */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border-top:1px solid var(--line)}
.m{padding:15px 16px 0 0;min-width:0}
.m + .m{padding-left:16px;border-left:1px solid var(--line)}
.m b{display:block;font:300 clamp(22px,2.5vw,38px)/1 var(--f-mono);letter-spacing:-.05em;font-stretch:90%;color:var(--ink);white-space:nowrap}
.m .mono{display:block;margin-top:10px;color:var(--ink-2);font-size:9.5px;letter-spacing:.08em}

.files{display:flex;align-items:baseline;gap:14px}
.files > .mono{color:var(--ink-3);flex:none}
.files ul{display:flex;flex-wrap:wrap;gap:6px}
.files li{font:400 10px/1 var(--f-mono);font-stretch:90%;letter-spacing:.03em;color:var(--ink-2);border:1px solid var(--line);padding:6px 8px;white-space:nowrap}
.files li i{font-style:normal;color:var(--ink-3)}
.foot-note{font-size:12.5px;color:var(--ink-3);max-width:90ch}

/* viz frame */
.viz{position:relative;border:1px solid var(--line);background:linear-gradient(180deg,rgba(140,220,208,.025),transparent 70%);padding:16px 18px 18px}
.viz .k{border-color:var(--line-3)}
.viz-cap{display:flex;justify-content:space-between;gap:12px;color:var(--ink-2);margin-bottom:16px}
.viz-cap button{color:var(--ink-2);border-bottom:1px solid var(--line-3);padding-bottom:1px}
.viz-cap button:hover{color:var(--ink)}
.viz-note{margin-top:14px;font-size:12.5px;line-height:1.5;color:var(--ink-2)}

/* track */
.track{position:relative;display:grid;grid-template-columns:repeat(var(--n,6),1fr);align-items:center;height:22px;--tone:var(--flare)}
.track[data-tone="signal"]{--tone:var(--signal)}
.track::before,.track::after{content:"";position:absolute;top:50%;height:1px;left:calc(50% / var(--n,6))}
.track::before{right:calc(50% / var(--n,6));background:var(--line-2)}
.track::after{width:calc((100% - 100% / var(--n,6)) * (var(--at) - 1) / (var(--n,6) - 1));background:var(--tone);box-shadow:0 0 8px var(--tone);transform-origin:left}
.track i{position:relative;z-index:1;justify-self:center;width:9px;height:9px;border-radius:50%;border:1px solid var(--line-3);background:var(--void)}
.track i.on{background:var(--tone);border-color:var(--tone)}
.track i.now{box-shadow:0 0 0 4px color-mix(in srgb,var(--tone) 20%,transparent),0 0 14px var(--tone)}
.track[data-tone="flare"] i.now{animation:ring 2s ease-in-out infinite}
@keyframes ring{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--tone) 8%,transparent),0 0 14px var(--tone)}}
@media (prefers-reduced-motion:no-preference){
  .track::after{transform:scaleX(0)}
  .is-on .track::after{transform:scaleX(1);transition:transform 1.1s var(--ease) calc(var(--i,0) * 75ms + 420ms)}
}
.stages{display:grid;grid-template-columns:repeat(var(--n,6),1fr);text-align:center;color:var(--ink-2);font-size:8.5px;letter-spacing:.03em;font-stretch:80%}
.track-wrap{display:grid;gap:12px}
.viz .stages span{padding:0 2px}

/* cells */
.cells{display:grid;grid-template-columns:repeat(var(--cols),var(--sz,14px));gap:var(--gp,4px)}
.cells.xs{--sz:4px;--gp:2px}
.cells.sm{--sz:6px;--gp:3px}
.csets{display:flex;flex-wrap:wrap;gap:12px 18px}
.cset .mono{display:block;margin-top:9px;color:var(--ink-2);font-size:9px}
.cells.md{--sz:10px;--gp:4px}
.cells.lg{--sz:30px;--gp:6px}
.cells i{display:block;width:var(--sz,14px);height:var(--sz,14px);border:1px solid var(--line-2);background:transparent}
.cells i.t1{background:var(--t1);border-color:var(--t1)}
.cells i.t2{background:var(--t2);border-color:var(--t2)}
.cells i.t3{background:var(--t3);border-color:var(--t3)}
.cells i.off{background:transparent;border-color:var(--line-3)}
@media (prefers-reduced-motion:no-preference){
  .cells i{opacity:0}
  .is-on .cells i{animation:cell .45s var(--ease) both;animation-delay:calc(var(--k) * var(--step,6ms) + 420ms)}
  .is-leaving .cells i{opacity:1}
}
@keyframes cell{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.key{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;color:var(--ink-2);font-size:9.5px}
.key li{display:flex;align-items:center;gap:8px}
.key li i{width:9px;height:9px;border:1px solid var(--line-3)}
.key li i.t1{background:var(--t1);border-color:var(--t1)} .key li i.t2{background:var(--t2);border-color:var(--t2)} .key li i.t3{background:var(--t3);border-color:var(--t3)}
.key b{color:var(--ink);font-weight:500}

/* horizontal bars */
.hbars{display:grid;gap:14px}
.hb{display:grid;grid-template-columns:minmax(80px,auto) minmax(0,1fr) auto;align-items:center;gap:14px}
.hb-l{font-size:13px;color:var(--ink-2)}
.hb-t{height:12px;position:relative}
.hb-t i{position:absolute;left:0;top:0;bottom:0;width:max(var(--w),3px);background:var(--t2);border-radius:0 4px 4px 0}
.hb-t i.hi{background:var(--t3)}
.hb-v{font:400 12px/1 var(--f-mono);color:var(--ink);white-space:nowrap}
@media (prefers-reduced-motion:no-preference){
  .hb-t i{transform:scaleX(0);transform-origin:left}
  .is-on .hb-t i{transform:scaleX(1);transition:transform 1s var(--ease) .5s}
}

/* list viz */
.vlist{display:grid;gap:0}
.vlist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 14px;padding:8px 0;border-top:1px solid var(--line)}
.vlist li:first-child{border-top:0;padding-top:0}
.vlist b{font:500 14px/1.3 var(--f-disp);letter-spacing:-.01em}
.vlist .tag{color:var(--ink-3);font-size:9px;text-align:right}
.vlist span:not(.tag){grid-column:1 / -1;font-size:12.5px;line-height:1.45;color:var(--ink-2)}
.vstack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:22px}
.vstack li{display:grid;grid-template-columns:5ch 1fr;align-items:baseline;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.vstack li:nth-child(-n+2){border-top:0;padding-top:0}
.vstack b{font:300 22px/1 var(--f-mono);letter-spacing:-.05em;font-stretch:90%;color:var(--t3)}
.vstack span{font-size:13.5px;color:var(--ink)}
.roots{display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:center;gap:18px}
.roots .arrow{width:34px;height:1px;background:var(--line-3);position:relative}
.roots .arrow::after{content:"";position:absolute;right:0;top:-3px;border:3.5px solid transparent;border-left:5px solid var(--line-3);border-right:0}
.roots ol{display:grid;gap:10px}
.roots ol li{display:flex;gap:12px;align-items:baseline;font:500 14px/1.3 var(--f-disp)}
.roots ol li .mono{color:var(--signal);font-size:9.5px}
.tax{display:flex;flex-wrap:wrap;gap:8px}
.tax li{font:400 10.5px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);padding:9px 11px;border:1px solid var(--line-2);background:rgba(140,220,208,.03)}

/* ---------- cover ---------- */
.cover{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(250px,.75fr);gap:clamp(28px,5vw,80px);align-items:center;justify-content:normal}
.cv-main{display:flex;flex-direction:column;gap:clamp(18px,3vh,28px)}
.plate{position:relative;align-self:flex-start;display:grid;place-items:center;padding:16px 24px;background:var(--plate)}
.plate img{height:var(--ph,40px);width:auto}
.plate .k{border-color:var(--signal)}
.plate .k.tl{transform:translate(-6px,-6px)} .plate .k.tr{transform:translate(6px,-6px)} .plate .k.bl{transform:translate(-6px,6px)} .plate .k.br{transform:translate(6px,6px)}
.cv-title{font:200 clamp(36px,min(5.6vw,9vh),88px)/.98 var(--f-disp);letter-spacing:-.05em;max-width:15ch;text-wrap:balance}
.cv-title b{font-weight:500}
.cv-index{border-left:1px solid var(--line);padding-left:clamp(16px,2vw,28px)}
.cv-index > .mono{display:block;color:var(--ink-3);margin-bottom:12px}
.cv-index li button{display:grid;grid-template-columns:3ch minmax(0,1fr) auto;align-items:baseline;gap:12px;width:100%;padding:8px 0;text-align:left;border-bottom:1px solid var(--line);transition:color .2s}
.cv-index li:first-child button{border-top:1px solid var(--line)}
.cv-index .n{font:400 10px/1 var(--f-mono);color:var(--ink-3)}
.cv-index .t{font:400 14.5px/1.3 var(--f-disp);color:var(--ink);letter-spacing:-.005em}
.cv-index .c{font-size:9px;color:var(--ink-3)}
.cv-index li button:hover .t{color:var(--signal)}
.cv-index li button:hover .n{color:var(--signal)}

/* ---------- pipeline ---------- */
.pipe{border-top:1px solid var(--line)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1.42fr);gap:clamp(16px,2.6vw,44px);align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.prow.head{padding:10px 0 9px}
.prow.head > .mono{color:var(--ink-3);font-size:9px}
.role b{display:block;font:500 clamp(14px,1.12vw,16.5px)/1.25 var(--f-disp);letter-spacing:-.01em}
.role span{font-size:12px;color:var(--ink-2)}
.state{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center}
.state .chip{height:24px;padding:0 9px;font-size:9px}
.state .who{font:500 13.5px/1.3 var(--f-disp)}
.state small{grid-column:1 / -1;font-size:11.5px;line-height:1.4;color:var(--ink-2)}

/* ---------- rail (method) ---------- */
.rail{position:relative;display:grid;grid-template-columns:repeat(var(--n,7),minmax(0,1fr));border-top:1px solid var(--line)}
.rail::before{content:"";position:absolute;top:-1px;left:0;width:100%;height:1px;background:var(--signal);box-shadow:0 0 10px var(--signal);transform-origin:left}
@media (prefers-reduced-motion:no-preference){
  .rail::before{transform:scaleX(0)}
  .is-on .rail::before{transform:scaleX(1);transition:transform 1.6s var(--ease) .35s}
}
.step{position:relative;padding:20px 16px 0 0}
.step + .step{padding-left:16px;border-left:1px solid var(--line)}
.step::before{content:"";position:absolute;top:-4px;left:-4px;width:7px;height:7px;background:var(--void);border:1px solid var(--signal)}
.step:first-child::before{left:0}
.step .mono{color:var(--ink-3);font-size:9px}
.step h4{margin:8px 0 12px;font:500 15px/1.2 var(--f-disp);letter-spacing:-.01em}
.step .big{display:block;font:300 clamp(26px,2.5vw,38px)/1 var(--f-mono);letter-spacing:-.05em;font-stretch:90%;color:var(--t3);margin-bottom:10px}
.step p{font-size:12.5px;line-height:1.5;color:var(--ink-2)}
.partners{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.partners > .mono{color:var(--ink-3);margin-right:6px}
.partners ul{display:flex;flex-wrap:wrap;gap:8px}
.partners li{font:500 13px/1 var(--f-disp);padding:8px 11px;border:1px solid var(--line-2)}

/* ---------- syllabus ---------- */
.layers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.layer{padding:16px 18px 0 0}
.layer + .layer{padding-left:18px;border-left:1px solid var(--line)}
.layer .lv{color:var(--ink-3);font-size:9px}
.layer .big{display:block;margin:10px 0 6px;font:300 clamp(30px,3vw,46px)/1 var(--f-mono);letter-spacing:-.05em;font-stretch:90%;color:var(--t3)}
.layer h4{font:500 15px/1.2 var(--f-disp);margin-bottom:8px}
.layer p{font-size:12.5px;line-height:1.5;color:var(--ink-2)}
.cadence{display:grid;grid-template-columns:.72fr repeat(6,minmax(0,1fr));gap:4px}
.cad{position:relative;padding:12px 12px 10px;background:rgba(140,220,208,.035);border-top:2px solid var(--t2);min-width:0}
.cad:first-child{border-top-color:var(--t1)}
.cad .mono{color:var(--ink-3);font-size:9px}
.cad b{display:block;margin-top:6px;font:500 13px/1.25 var(--f-disp)}
.cad-cap{display:flex;justify-content:space-between;gap:16px;color:var(--ink-2);margin-bottom:10px}

/* ---------- org ---------- */
.org{display:grid;justify-items:center;padding-top:4px}
.org-top{position:relative;display:grid;justify-items:center;gap:6px;padding:12px 22px;border:1px solid var(--line-3);background:rgba(140,220,208,.04)}
.org-top b{font:500 15px/1 var(--f-disp)}
.org-top .mono{color:var(--ink-2);font-size:9px}
.org-kids{position:relative;width:100%;display:grid;grid-template-columns:repeat(var(--n,7),minmax(0,1fr));gap:10px;margin-top:26px}
.org-kids::before{content:"";position:absolute;top:-13px;left:calc(100% / var(--n,7) / 2);right:calc(100% / var(--n,7) / 2);height:1px;background:var(--line-3)}
.org-kids::after{content:"";position:absolute;top:-26px;left:50%;height:13px;width:1px;background:var(--line-3)}
.org-n{position:relative;display:flex;align-items:center;justify-content:center;gap:9px;padding:11px 8px;border:1px solid var(--line-2);text-align:center;font:500 13px/1.2 var(--f-disp)}
.org-n::before{content:"";position:absolute;top:-14px;left:50%;height:13px;width:1px;background:var(--line-3)}
.org-n i{flex:none;width:7px;height:7px;border-radius:50%;border:1px solid var(--ink-3)}
.org-n[data-s="signal"] i{background:var(--signal);border-color:var(--signal);box-shadow:0 0 8px var(--signal)}
.org-n[data-s="flare"] i{background:var(--flare);border-color:var(--flare)}
.org-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px;width:100%;margin-top:14px;color:var(--ink-2);font-size:9.5px}
.org-foot .key{margin:0}
.org-foot .key li i{border-radius:50%}
.org-foot .key li i.sig{background:var(--signal);border-color:var(--signal)}
.org-foot .key li i.fla{background:var(--flare);border-color:var(--flare)}

/* ---------- cards ---------- */
.cards{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.card{background:var(--void);padding:clamp(14px,1.5vw,20px);display:flex;flex-direction:column;gap:7px;transition:background .3s}
.card:hover{background:var(--hull)}
.card .tag{color:var(--signal);font-size:9px}
.card h4{font:500 clamp(14.5px,1.2vw,17.5px)/1.22 var(--f-disp);letter-spacing:-.015em}
.card .num{font:300 26px/1 var(--f-mono);letter-spacing:-.05em;font-stretch:90%;color:var(--t3);margin:2px 0}
.card p{font-size:12.5px;line-height:1.5;color:var(--ink-2);text-wrap:pretty}
.foot-row{display:flex;flex-wrap:wrap;gap:6px 26px;color:var(--ink-2);font-size:12.5px}
.foot-row b{color:var(--ink);font-weight:500}

/* ---------- plan ---------- */
.plan-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(20px,3.4vw,56px);align-items:start}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .axis text{fill:var(--ink-3);font:400 10px var(--f-mono)}
.chart .lbl text{fill:var(--ink);font:500 11.5px var(--f-disp)}
.chart .lbl text tspan.v{fill:var(--ink-2);font:400 10.5px var(--f-mono)}
.chart path.s{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .s1{stroke:var(--t1)} .chart .s2{stroke:var(--t2)} .chart .s3{stroke:var(--t3)} .chart .s4{stroke:var(--ink-2);stroke-dasharray:5 5}
.chart circle.dot{stroke:var(--void);stroke-width:2}
.chart .d1{fill:var(--t1)} .chart .d2{fill:var(--t2)} .chart .d3{fill:var(--t3)} .chart .d4{fill:var(--ink-2)}
.chart .xh{stroke:var(--line-3);stroke-width:1;opacity:0}
.chart.hovering .xh{opacity:1}
.chart .hit{fill:transparent;cursor:crosshair}
@media (prefers-reduced-motion:no-preference){
  .chart .series{clip-path:inset(0 100% 0 0)}
  .is-on .chart .series{clip-path:inset(0 0 0 0);transition:clip-path 1.5s var(--ease) .45s}
  .is-leaving .chart .series{clip-path:inset(0 0 0 0)}
}
.legend-row{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:12px;color:var(--ink-2);font-size:9.5px}
.legend-row li{display:flex;align-items:center;gap:8px}
.legend-row i{width:16px;height:2px;background:var(--c)}
.legend-row i.dash{background:repeating-linear-gradient(90deg,var(--ink-2) 0 4px,transparent 4px 8px)}
.ctable{width:100%;border-collapse:collapse;font:400 12px/1.4 var(--f-mono)}
.ctable th,.ctable td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right}
.ctable th:first-child,.ctable td:first-child{text-align:left;font-family:var(--f-disp);font-size:13px}
.ctable th{color:var(--ink-2);font-weight:400;font-size:10px;letter-spacing:.06em}
.facts{display:grid;gap:0}
.facts li{padding:12px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.5;color:rgba(230,239,237,.9)}
.facts li:first-child{border-top:0;padding-top:0}
.facts li b{font-family:var(--f-mono);font-weight:400;color:var(--t3);font-size:13px}
.peers{display:flex;flex-wrap:wrap;gap:6px}
.peers li{font:400 10px/1 var(--f-mono);font-stretch:90%;letter-spacing:.04em;color:var(--ink-2);padding:6px 8px;border:1px solid var(--line)}

/* ---------- close ---------- */
.close-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(24px,4vw,64px);align-items:start}
.next li{display:grid;grid-template-columns:minmax(120px,.42fr) minmax(0,1fr);gap:16px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.next + .actions{margin-top:22px}
.next li:last-child{border-bottom:1px solid var(--line)}
.next .who{display:flex;align-items:center;gap:9px;color:var(--ink-2)}
.next .who::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--tone,var(--flare))}
.next li[data-tone="signal"]{--tone:var(--signal)} .next li[data-tone="hold"]{--tone:var(--hold)}
.next li[data-tone="hold"] .who::before{background:transparent;border:1px solid var(--hold)}
.next .what{font-size:13.5px;line-height:1.45}
.next .when{color:var(--ink-3);font-size:9px;margin-left:auto}
.score .hbars{gap:12px}
.score .hb{grid-template-columns:minmax(150px,auto) minmax(0,1fr) 4.5ch}
.quotes{display:grid;gap:14px;margin-top:22px}
.quotes blockquote{margin:0;padding-left:16px;border-left:1px solid var(--signal)}
.quotes p{font:300 clamp(16px,1.35vw,20px)/1.35 var(--f-disp);letter-spacing:-.015em}
.quotes cite{display:block;margin-top:6px;font-style:normal;color:var(--ink-3)}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:10px;height:42px;padding:0 16px;border:1px solid var(--line-3);color:var(--ink);font:400 10.5px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;transition:background .25s,border-color .25s,color .25s}
.btn:hover{background:rgba(140,220,208,.07);border-color:var(--signal)}
.btn.primary{background:var(--plate);color:var(--plate-ink);border-color:var(--plate)}
.btn.primary:hover{background:#fff}
.btn svg{width:14px;height:14px}

/* ---------- tooltip ---------- */
.tip{position:fixed;z-index:50;pointer-events:none;max-width:260px;padding:8px 10px;background:var(--hull-2);border:1px solid var(--line-3);color:var(--ink);font:400 11.5px/1.45 var(--f-body);box-shadow:0 10px 30px rgba(0,0,0,.45);white-space:pre-line}

/* ---------- masking client data ---------- */
.masked .conf{filter:blur(7px);user-select:none;transition:filter .3s}
.conf{transition:filter .3s}

/* ============================================================
   Responsive
   ============================================================ */
@media (max-height:820px) and (min-width:861px){
  .bar{min-height:54px}
  .deck-foot,.prog{min-height:50px;height:50px}
  .slide{padding-top:18px;padding-bottom:18px}
  .s-title{font-size:clamp(28px,min(3.9vw,6.1vh),50px)}
  .prow{padding:5px 0}
  .prow.head{padding:6px 0}
  .role b{font-size:14.5px}
  .files{display:none}
  .sl{gap:16px}
  .pw p,.pw li{font-size:13px}
  .viz{padding:12px 14px 14px}
  .step p,.layer p,.card p{font-size:12px}
}
@media (max-width:1100px){
  .s-copy.split{grid-template-columns:minmax(0,1fr);gap:14px}
  .rail{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:22px}
  .rail .step:nth-child(4n+1){border-left:0;padding-left:0}
  .cadence{grid-template-columns:repeat(4,minmax(0,1fr))}
  .where .crumb{display:none}
}
@media (max-width:860px){
  body{font-size:14px}
  .home-mid{overflow-y:auto;align-items:start;padding-top:28px;padding-bottom:28px}
  .wall-col:nth-child(n+5){display:none}
  .tiles{grid-template-columns:1fr;gap:12px}
  .tile{height:140px}
  .home-foot .keys,.home-bar .stamp{display:none}
  .switch{display:none}
  .maskbtn .txt{display:none}
  .slide{padding:22px 16px 36px}
  .sl{justify-content:flex-start;gap:20px}
  .s-top,.plan-grid,.close-grid,.cover{grid-template-columns:minmax(0,1fr)}
  .pws{grid-template-columns:minmax(0,1fr)}
  .pw{padding:14px 0 0}
  .pw + .pw{padding-left:0;border-left:0;border-top:1px solid var(--line);margin-top:14px}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .m:nth-child(2n+1){padding-left:0;border-left:0}
  .m{padding-bottom:12px}
  .prow{grid-template-columns:minmax(0,1fr);gap:10px}
  .prow.head{display:none}
  .rail{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rail .step:nth-child(odd){border-left:0;padding-left:0}
  .rail .step:nth-child(4n+1){border-left:0}
  .layers{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:18px}
  .layer:nth-child(odd){padding-left:0;border-left:0}
  .cadence{grid-template-columns:repeat(2,minmax(0,1fr))}
  .org-kids{grid-template-columns:repeat(2,minmax(0,1fr))}
  .org-kids::before,.org-kids::after,.org-n::before{display:none}
  .cards{--cols:1!important}
  .cv-index{border-left:0;padding-left:0}
  .next li{grid-template-columns:minmax(0,1fr)}
  .roots{grid-template-columns:minmax(0,1fr)}
  .roots .arrow{display:none}
  .seg .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .wall-col ul{transform:translate3d(0,-12%,0)}
}
</style>
</head>
<body>

<!-- ================= HOME ================= -->
<div id="home" class="view home">

/* ============================================================
   Helpers
   ============================================================ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const RM = matchMedia("(prefers-reduced-motion: reduce)");
const ARROW = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg>';
const KS = '<span class="k tl"></span><span class="k tr"></span><span class="k bl"></span><span class="k br"></span>';

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ============================================================
   Home
   ============================================================ */
function buildHome() {
  const total = CLIENTS.dinshaws.docs + CLIENTS.vakils.docs;
  $("#stamp").textContent = `Index · ${STAMP} · ${total} documents`;
  $("#hero-lede").textContent = `Two clients, ${total} documents, and every workstream behind them: leadership hiring, governance, AI products, systems and research. Choose a client to open its deck.`;
  $("#tiles").innerHTML = Object.values(CLIENTS).map(c => `
    <a class="tile" href="#/${c.id}/1" data-k="${c.key}" style="--lh:${c.lh}" aria-label="Open the ${esc(c.name)} deck">
      ${KS}<span class="scan" aria-hidden="true"></span>
      <img src="${c.logo}" alt="${esc(c.name)}">
      <span class="go mono" aria-hidden="true">Open deck →</span>
      <span class="tile-meta mono">${c.streams} workstreams · ${c.docs} documents</span>
    </a>`).join("");
  $("#legend").innerHTML = Object.values(CLIENTS).map(c => `<span style="--c:var(--${c.key})">${esc(c.name)} · ${c.docs}</span>`).join("");

  const home = $("#home");
  $$(".tile").forEach(t => {
    const on = () => home.dataset.focus = t.dataset.k;
    const off = () => delete home.dataset.focus;
    t.addEventListener("pointerenter", on); t.addEventListener("focus", on);
    t.addEventListener("pointerleave", off); t.addEventListener("blur", off);
  });

  // the wall: every document, shuffled once, in drifting columns
  const r = rng(1932);
  const items = [...WALL.d.map(x => ["d", x]), ...WALL.v.map(x => ["v", x])];
  for (let i = items.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [items[i], items[j]] = [items[j], items[i]]; }
  const COLS = 8, cols = Array.from({ length: COLS }, () => []);
  items.forEach((it, i) => cols[i % COLS].push(it));
  $("#wall").innerHTML = cols.map((col, ci) => {
    const lis = col.map(([c, x]) => { const [n, e] = x.split("|"); return `<li data-c="${c}" style="--t:${(r() * .45).toFixed(2)}s">${esc(n)} <i>.${e}</i></li>`; }).join("");
    const dur = 120 + Math.round(r() * 90);
    return `<div class="wall-col"><ul style="--dur:${dur}s;--off:-${Math.round(r() * dur)}s">${lis}${lis}</ul></div>`;
  }).join("");
}

const T = s => esc(s);

const metrics = (m, cls = "") => !m ? "" : `<div class="metrics r ${cls}">${m.map(([v, l, conf]) =>
  `<div class="m"><b class="${conf ? "conf" : ""}"${/^\d+$/.test(v) ? ` data-count="${v}"` : ""}>${T(v)}</b><span class="mono">${T(l)}</span></div>`).join("")}</div>`;
const files = f => !f ? "" : `<div class="files r"><span class="mono">Artefacts</span><ul>${f.map(x => { const [n, e] = x.split("|"); return `<li>${T(n)} <i>.${T(e)}</i></li>`; }).join("")}</ul></div>`;
const track = (at, n, tone) => `<div class="track" style="--at:${at};--n:${n}" data-tone="${tone}">${Array.from({ length: n }, (_, i) => `<i class="${i + 1 < at ? "on" : i + 1 === at ? "on now" : ""}"></i>`).join("")}</div>`;

const VIZ = {
  track: v => `<div class="track-wrap"><div class="stages mono" style="--n:${v.steps.length}">${v.steps.map(s => `<span>${T(s)}</span>`).join("")}</div>${track(v.at, v.steps.length, v.tone)}</div>`
    + (v.list ? `<ul class="vlist" style="margin-top:18px">${v.list.map(x => `<li><span>${T(x)}</span></li>`).join("")}</ul>` : ""),
  cells: v => {
    let k = 0; const total = v.groups.reduce((a, g) => a + g.n, 0);
    const step = Math.max(1.1, Math.min(45, 620 / total)).toFixed(1);
    const cells = v.groups.map(g => Array.from({ length: g.n }, () => `<i class="${g.cls}" style="--k:${k++}" data-tip="${esc(g.label)}"></i>`).join("")).join("");
    const key = v.groups.length > 1 ? `<ul class="key mono">${v.groups.map(g => `<li><i class="${g.cls}"></i>${T(g.label)}${/\d/.test(g.label) ? "" : ` <b>${g.n}</b>`}</li>`).join("")}</ul>` : "";
    return `<div class="cells ${v.size || ""}" style="--cols:${v.cols};--step:${step}ms" role="img" aria-label="${esc(v.groups.map(g => g.n + " " + g.label).join(", "))}">${cells}</div>${key}`;
  },
  hbars: v => {
    const max = Math.max(...v.rows.map(r => r.v));
    return `<div class="hbars">${v.rows.map(r => `<div class="hb"><span class="hb-l">${T(r.l)}</span><span class="hb-t"><i class="${r.hi ? "hi" : ""}" style="--w:${(r.v / max * 100).toFixed(2)}%" data-tip="${esc(r.l + ": " + r.d)}"></i></span><b class="hb-v">${T(r.d)}</b></div>`).join("")}</div>`;
  },
  list: v => `<ul class="vlist">${v.items.map(x => `<li><b>${T(x.h)}</b><span class="tag mono">${T(x.tag)}</span><span>${T(x.p)}</span></li>`).join("")}</ul>`,
  stack: v => `<ul class="vstack">${v.rows.map(([n, l]) => `<li><b>${T(n)}</b><span>${T(l)}</span></li>`).join("")}</ul>`,
  roots: v => `<div class="roots">${VIZ.cells({ groups: [{ n: v.n, cls: "t2", label: "One documented gap" }], cols: 5, size: "md" })}<span class="arrow" aria-hidden="true"></span><ol>${v.roots.map((x, i) => `<li><span class="mono">Root ${i + 1}</span>${T(x)}</li>`).join("")}</ol></div>`,
  cellsets: v => {
    let k = 0; const total = v.sets.reduce((a, x) => a + x.n, 0);
    const step = Math.max(.5, 620 / total).toFixed(2);
    return `<div class="csets" role="img" aria-label="${esc(v.sets.map(x => x.n + " " + x.label).join(", "))}">${v.sets.map(x => `<div class="cset"><div class="cells xs" style="--cols:${v.cols};--step:${step}ms">${Array.from({ length: x.n }, () => `<i class="t2" style="--k:${k++}" data-tip="${esc(x.label)} · one scored answer"></i>`).join("")}</div><span class="mono">${T(x.label)} · ${x.n}</span></div>`).join("")}</div>`;
  },
  tax: v => `<ul class="tax">${v.chips.map(c => `<li>${T(c)}</li>`).join("")}</ul>`
};
const vizBox = v => `<figure class="viz r ${v.conf ? "conf" : ""}">${KS}<figcaption class="viz-cap mono"><span>${T(v.cap)}</span>${v.capR ? `<span>${T(v.capR)}</span>` : ""}</figcaption>${VIZ[v.kind](v)}${v.note ? `<p class="viz-note ${v.noteConf ? "conf" : ""}">${T(v.note)}</p>` : ""}</figure>`;

        <figure class="viz chart r conf">${KS}${lineChart(s.chart)}</figure>
        <div class="r" style="display:grid;gap:18px">
          <ul class="facts conf">${s.facts.map(f => `<li>${f}</li>`).join("")}</ul>
          <div><p class="mono" style="color:var(--ink-3);margin-bottom:10px">The peer set</p><ul class="peers">${PEERS.map(p => `<li>${T(p)}</li>`).join("")}</ul></div>
          ${metrics(s.metrics, "mini")}
        </div>
      </div>
    </div>`;
  },
  close(s, c) {
    const o = CLIENTS[s.other];
    const left = s.scores
      ? `<div class="score r"><p class="mono" style="color:var(--ink-2);margin-bottom:16px">${T(s.scores.cap)}</p>${VIZ.hbars({ rows: s.scores.rows.map(([l, v]) => ({ l, v, d: String(v), hi: v >= 9 })) })}
          <div class="quotes">${s.quotes.map(([q, w]) => `<blockquote><p>“${T(q)}”</p><cite class="mono">${T(w)}</cite></blockquote>`).join("")}</div></div>`
      : `<figure class="viz r">${KS}<figcaption class="viz-cap mono"><span>The engagement in numbers</span></figcaption>${VIZ.stack({ rows: s.metrics })}</figure>`;
    return `<div class="sl">
      ${head(s)}
      <h2 class="s-title r">${s.title}</h2>
      <div class="close-grid">
        ${left}
        <div class="r"><p class="mono" style="color:var(--ink-2);margin-bottom:12px">Next</p>
          <ol class="next">${s.next.map(([w, t, tone, conf]) => `<li data-tone="${tone}"><span class="who mono">${T(w)}</span><span class="what ${conf ? "conf" : ""}">${T(t)}</span></li>`).join("")}</ol>
          <div class="actions">
            <a class="btn" href="#/">${'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M13 8H3M7 4 3 8l4 4"/></svg>'}All clients</a>
            <a class="btn primary" href="#/${o.id}/1">Open the ${esc(o.name)} deck ${ARROW}</a>
          </div></div>
      </div>
    </div>`;
  }
};

/* line chart: one y-axis, direct labels, legend, crosshair + tooltip, table view */
function lineChart(c) {
  const W = 600, H = 300, pl = 40, pr = 132, pt = 14, pb = 30;
  const n = c.years.length;
  const x = i => pl + i * (W - pl - pr) / (n - 1);
  const y = v => pt + (H - pt - pb) * (1 - (v - c.min) / (c.max - c.min));
  const ticks = []; for (let v = c.min; v <= c.max; v += 100) ticks.push(v);
  const grid = ticks.map(v => `<line x1="${pl}" x2="${W - pr + 8}" y1="${y(v)}" y2="${y(v)}"/>`).join("");
  const yl = ticks.map(v => `<text x="${pl - 8}" y="${y(v) + 3.5}" text-anchor="end">${v}</text>`).join("");
  const xl = c.years.map((yr, i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${yr}</text>`).join("");
  const paths = c.series.map(s => `<path class="s s${s.cls}" d="${s.v.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ")}"/>`).join("");
  const ends = c.series.map(s => `<circle class="dot d${s.cls}" r="4" cx="${x(n - 1)}" cy="${y(s.v[n - 1])}"/>`).join("");
  const labels = c.series.map(s => `<text x="${x(n - 1) + 12}" y="${y(s.v[n - 1]) + 4}">${esc(s.name)} <tspan class="v">${Math.round(s.v[n - 1])}</tspan></text>`).join("");
  const legend = c.series.map(s => `<li><i class="${s.cls === 4 ? "dash" : ""}" style="--c:var(--t${s.cls})"></i>${esc(s.name)} · ${esc(s.tag)}</li>`).join("");
  const table = `<table class="ctable"><thead><tr><th>Scenario</th>${c.years.map(yr => `<th>${yr}</th>`).join("")}</tr></thead><tbody>${c.series.map(s => `<tr><td>${esc(s.name)} · ${esc(s.tag)}</td>${s.v.map(v => `<td>${v.toFixed(1)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  return `<figcaption class="viz-cap mono"><span>${esc(c.cap)}</span><button type="button" data-table aria-pressed="false">Table</button></figcaption>
    <ul class="legend-row mono">${legend}</ul>
    <div class="cw"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.cap + ": " + c.series.map(s => s.name + " reaches " + Math.round(s.v[n - 1]) + " by " + c.years[n - 1]).join("; "))}">
      <g class="grid">${grid}</g><g class="axis">${yl}${xl}</g>
      <line class="xh" y1="${pt}" y2="${H - pb}" x1="0" x2="0"/>
      <g class="series">${paths}${ends}<g class="lbl">${labels}</g></g>
      <rect class="hit" x="${pl}" y="${pt}" width="${W - pl - pr}" height="${H - pt - pb}"/>
    </svg></div>
    <div class="ct" hidden>${table}</div>`;
}

function wireChart(fig, c) {
  const svg = $("svg", fig);
  if (!svg) return;
  const hit = $(".hit", svg), xh = $(".xh", svg);
  const n = c.years.length, W = 600, pl = 40, pr = 132;
  hit.addEventListener("pointermove", e => {
    const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    const loc = p.matrixTransform(svg.getScreenCTM().inverse());
    const i = Math.max(0, Math.min(n - 1, Math.round((loc.x - pl) / ((W - pl - pr) / (n - 1)))));
    const xi = pl + i * (W - pl - pr) / (n - 1);
    xh.setAttribute("x1", xi); xh.setAttribute("x2", xi);
    fig.classList.add("hovering");
    showTip(`${c.years[i]} · ₹ Cr\n` + c.series.map(s => `${s.name}: ${s.v[i].toFixed(1)}`).join("\n"), e.clientX, e.clientY);
  });
  hit.addEventListener("pointerleave", () => { fig.classList.remove("hovering"); hideTip(); });
  const tb = $("[data-table]", fig);
  tb.addEventListener("click", () => {
    const on = tb.getAttribute("aria-pressed") !== "true";
    tb.setAttribute("aria-pressed", on); tb.textContent = on ? "Chart" : "Table";
    $(".cw", fig).hidden = on; $(".ct", fig).hidden = !on; $(".legend-row", fig).hidden = on;
  });
}

/* ============================================================
   Tooltip
   ============================================================ */
const tip = $("#tip");
function showTip(text, x, y) {
  tip.textContent = text; tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(window.innerWidth - w - 12, x + 14) + "px";
  tip.style.top = (y - h - 14 < 8 ? y + 18 : y - h - 14) + "px";
}
function hideTip() { tip.hidden = true; }
document.addEventListener("pointermove", e => {
  if (e.target.closest(".hit")) return;
  const el = e.target.closest("[data-tip]");
  if (el) showTip(el.dataset.tip, e.clientX, e.clientY); else hideTip();
});

/* ============================================================
   Deck engine
   ============================================================ */
const home = $("#home"), deck = $("#deck"), stage = $("#stage"), prog = $("#prog");
const state = { client: null, i: 0, slides: [], timer: 0 };

$("#switch").innerHTML = Object.values(CLIENTS).map(c => `<button type="button" data-id="${c.id}" aria-label="${esc(c.name)} deck"><img src="${c.logo}" alt=""></button>`).join("");
$$("#switch button").forEach(b => b.addEventListener("click", () => { location.hash = `#/${b.dataset.id}/1`; }));

function renderDeck(id) {
  const c = CLIENTS[id];
  state.client = id;
  deck.style.setProperty("--client", `var(--${c.key})`);
  stage.innerHTML = c.slides.map((s, i) =>
    `<section class="slide" data-i="${i}" aria-roledescription="slide" aria-label="${i + 1} of ${c.slides.length}: ${esc(s.nav)}">${R[s.type](s, c)}</section>`).join("");
  state.slides = $$(".slide", stage);
  state.slides.forEach(sl => $$(".r", sl).forEach((el, k) => el.style.setProperty("--i", k)));
  prog.innerHTML = c.slides.map((s, i) => `<button class="seg" type="button" data-go="${i}" aria-label="Slide ${i + 1}: ${esc(s.nav)}"><span class="lbl mono">${pad(i + 1)} · ${esc(s.nav)}</span></button>`).join("");
  $$("[data-go]", deck).forEach(b => b.addEventListener("click", () => go(+b.dataset.go)));
  c.slides.forEach((s, i) => { if (s.type === "plan") wireChart($(".chart", state.slides[i]), s.chart); });
  $$("#switch button").forEach(b => b.setAttribute("aria-current", b.dataset.id === id));
  document.title = `${c.name} · STAIR Client Work`;
}

function go(i, instant) {
  const n = state.slides.length;
  i = Math.max(0, Math.min(n - 1, i));
  const prev = state.i, cur = state.slides[prev], nxt = state.slides[i];
  const fwd = i >= prev;
  stage.style.setProperty("--from", fwd ? "32px" : "-32px");
  stage.style.setProperty("--to", fwd ? "-32px" : "32px");
  state.slides.forEach(s => { if (s !== cur && s !== nxt) s.classList.remove("is-on", "is-leaving"); });
  void nxt.offsetWidth;
  if (cur && cur !== nxt && !instant) {
    cur.classList.remove("is-on"); cur.classList.add("is-leaving");
    clearTimeout(state.timer); state.timer = setTimeout(() => cur.classList.remove("is-leaving"), 820);
  } else if (cur && cur !== nxt) cur.classList.remove("is-on");
  nxt.classList.add("is-on"); nxt.scrollTop = 0;
  state.i = i;
  const c = CLIENTS[state.client], s = c.slides[i];
  $("#crumb").textContent = s.cat === s.nav ? s.nav : `${s.cat} · ${s.nav}`;
  $("#count").innerHTML = `<b>${pad(i + 1)}</b> / ${pad(n)}`;
  $$(".seg", prog).forEach((b, k) => { b.classList.toggle("on", k === i); b.classList.toggle("done", k < i); b.setAttribute("aria-current", k === i ? "step" : "false"); });
  $("#prev").disabled = i === 0; $("#next").disabled = i === n - 1;
  history.replaceState(null, "", `#/${state.client}/${i + 1}`);
  countUp(nxt);
  hideTip();
}

function countUp(slide) {
  if (RM.matches) return;
  $$("[data-count]", slide).forEach(el => {
    const end = +el.dataset.count, t0 = performance.now(), dur = 900;
    const f = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = Math.round(end * e).toLocaleString("en-IN"); if (p < 1) requestAnimationFrame(f); };
    requestAnimationFrame(f);
  });
}

function show(view) {
  const on = view === "deck" ? deck : home, off = view === "deck" ? home : deck;
  if (!on.hidden) return;
  off.hidden = true; on.hidden = false;
  on.classList.remove("enter"); void on.offsetWidth; on.classList.add("enter");
}

function route() {
  const m = location.hash.match(/^#\/(dinshaws|vakils)(?:\/(\d+))?/);
  if (m) {
    const fresh = state.client !== m[1];
    if (fresh) { renderDeck(m[1]); state.i = 0; }
    show("deck");
    go(m[2] ? +m[2] - 1 : 0, fresh);
  } else {
    show("home");
    document.title = "STAIR Client Work";
    const t = state.client && $(`.tile[href^="#/${state.client}"]`);
    if (t) t.focus({ preventScroll: true });
  }
}

/* controls */
$("#back").addEventListener("click", () => { location.hash = "#/"; });
$("#prev").addEventListener("click", () => go(state.i - 1));
$("#next").addEventListener("click", () => go(state.i + 1));
const maskBtn = $("#mask");
function toggleMask() {
  const on = !document.body.classList.contains("masked");
  document.body.classList.toggle("masked", on);
  maskBtn.setAttribute("aria-pressed", on);
  $(".txt", maskBtn).textContent = on ? "Client data masked" : "Mask client data";
}
maskBtn.addEventListener("click", toggleMask);

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (!deck.hidden) {
    if (["ArrowRight", "PageDown"].includes(e.key) || (e.key === " " && !e.shiftKey)) { e.preventDefault(); go(state.i + 1); }
    else if (["ArrowLeft", "PageUp"].includes(e.key) || (e.key === " " && e.shiftKey)) { e.preventDefault(); go(state.i - 1); }
    else if (e.key === "Home") { e.preventDefault(); go(0); }
    else if (e.key === "End") { e.preventDefault(); go(state.slides.length - 1); }
    else if (e.key === "Escape") location.hash = "#/";
    else if (e.key === "m" || e.key === "M") toggleMask();
  } else {
    const tiles = $$(".tile"), k = tiles.indexOf(document.activeElement);
    if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); tiles[(k + 1) % tiles.length].focus(); }
    else if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); tiles[(k - 1 + tiles.length) % tiles.length].focus(); }
    else if (e.key === "1" || e.key === "2") location.hash = tiles[+e.key - 1].getAttribute("href");
  }
});

/* touch swipe */
let sx = 0, sy = 0;
stage.addEventListener("pointerdown", e => { if (e.pointerType === "touch") { sx = e.clientX; sy = e.clientY; } });
stage.addEventListener("pointerup", e => {
  if (e.pointerType !== "touch") return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(state.i + (dx < 0 ? 1 : -1));
});

buildHome();
window.addEventListener("hashchange", route);
route();
})();
</script>
</body>
</html>
